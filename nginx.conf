# Serves the prerendered site behind Dokku's proxy, which terminates TLS and
# redirects HTTP to HTTPS.

# The root has no page of its own: an explicit choice from the language switch
# (cookie) wins, otherwise German browsers get /de and everyone else /en.
map $cookie_lang $language_from_cookie {
    de de;
    en en;
    default '';
}

map $http_accept_language $language_from_browser {
    ~*^de de;
    default en;
}

server {
    listen 5000;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Canonical host is www.
    if ($host = 'datenwissenschaften.com') {
        return 301 https://www.datenwissenschaften.com$request_uri;
    }

    # English pages moved under /en.
    rewrite ^/(services|work|about|contact|case-study|products|imprint)/?$ /en/$1 permanent;

    # The locations page was removed; its URLs point to the profile instead.
    rewrite ^/(en/)?locations/?$ /en/about permanent;
    rewrite ^/de/standorte/?$ /de/ueber-mich permanent;

    # One canonical form per URL: no trailing slashes.
    rewrite ^/(.+)/$ /$1 permanent;

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private, no-cache";
        add_header Vary "Accept-Language, Cookie";
        if ($language_from_cookie) {
            return 302 /$language_from_cookie;
        }
        return 302 /$language_from_browser;
    }

    # Hashed build assets never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /de/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        error_page 404 /de/404.html;
        try_files $uri $uri/index.html =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /de/404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
