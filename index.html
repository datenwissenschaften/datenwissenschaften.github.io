<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="author" content="Dr. Martin Franke" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#0b0d0f" />
    <!-- Title, description, canonical, hreflang, Open Graph and JSON-LD are rendered per route (src/seo.ts). -->
    <script>
      // Apply the saved or preferred theme before first paint to avoid a flash.
      try {
        const theme = localStorage.getItem('dw-theme') ?? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {}
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script defer src="https://tracking.datenwissenschaften.com/script.js" data-website-id="dc388437-b482-400b-96d1-75b29e28c1c0"></script>
    <script defer src="/chatbot.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
