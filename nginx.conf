# Serves the prerendered site behind Dokku's proxy, which terminates TLS and
# redirects HTTP to HTTPS.
server {
    listen 5000;
    server_name _;
    root /usr/share/nginx/html;

    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Canonical host is www.
    if ($host = 'datenwissenschaften.com') {
        return 301 https://www.datenwissenschaften.com$request_uri;
    }

    # One canonical form per URL: no trailing slashes.
    rewrite ^/(.+)/$ /$1 permanent;

    # Hashed build assets never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
