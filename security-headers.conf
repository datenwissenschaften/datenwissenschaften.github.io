# Included in every nginx location (add_header does not inherit once a location sets its own).
# The script hash covers the inline theme script in index.html; the Docker build fills it in.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'THEME_SCRIPT_HASH' https://tracking.datenwissenschaften.com https://knotbase.io; style-src 'self' 'unsafe-inline' https://knotbase.io; img-src 'self' data: https:; font-src 'self' data: https://knotbase.io; connect-src 'self' https://tracking.datenwissenschaften.com https://knotbase.io; frame-src https://www.google.com https://knotbase.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
